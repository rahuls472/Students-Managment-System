<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Shraddha!</title>
<style>
  :root{
    --pink-1:#ffd6e8;
    --pink-2:#ffb8d9;
    --pink-3:#ff8fc0;
    --pink-deep:#b5175a;
    --cream:#fff6f9;
    --gold:#ffd166;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 0%, var(--pink-1), var(--pink-2) 55%, var(--pink-3) 100%);
    position:relative;
  }

  .phone{
    position:relative;
    width:420px;
    max-width:100vw;
    height:100vh;
    max-height:900px;
    background:linear-gradient(180deg, #ffe0ee 0%, #ffc7de 45%, #ff9dc3 100%);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 20px 60px rgba(150,20,80,0.35);
    border-radius:0;
  }

  @media (min-width:480px){
    .phone{
      border-radius:36px;
      height:880px;
    }
  }

  /* ---------- floating ambient decorations ---------- */
  .float-deco{
    position:absolute;
    pointer-events:none;
    opacity:0.85;
    animation: drift 6s ease-in-out infinite;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.08));
    z-index:1;
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-18px) rotate(8deg); }
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.3; transform:scale(0.8) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(20deg); }
  }

  /* ---------- bunting ---------- */
  .bunting{
    position:absolute;
    top:38px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    z-index:2;
  }
  .bunting svg{ width:88%; }

  /* ---------- scene: bear + panda + cake ---------- */
  .scene{
    position:relative;
    margin-top:96px;
    width:320px;
    height:300px;
    z-index:3;
    animation:scene-in 1s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes scene-in{
    0%{ opacity:0; transform:translateY(40px) scale(0.85); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .bear{
    position:absolute;
    left:0;
    bottom:10px;
    width:150px;
    animation: sway 3.2s ease-in-out infinite;
    transform-origin:bottom center;
  }
  .panda{
    position:absolute;
    right:-6px;
    bottom:14px;
    width:150px;
    animation: sway 3.2s ease-in-out infinite 0.4s;
    transform-origin:bottom center;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-2deg); }
    50%{ transform:rotate(2deg); }
  }

  .cake{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:170px;
    z-index:4;
    animation: cake-pop 1s cubic-bezier(.34,1.56,.64,1) 0.3s both;
  }
  @keyframes cake-pop{
    0%{ opacity:0; transform:translateX(-50%) scale(0.6); }
    100%{ opacity:1; transform:translateX(-50%) scale(1); }
  }

  .flame{
    animation: flicker 0.6s ease-in-out infinite alternate;
    transform-origin:center bottom;
  }
  @keyframes flicker{
    0%{ transform:scale(1) rotate(-3deg); opacity:1; }
    100%{ transform:scale(1.15) rotate(3deg); opacity:0.85; }
  }

  .sparkle-cake{
    animation: twinkle 1.4s ease-in-out infinite;
  }

  /* ---------- text ---------- */
  .msg{
    position:relative;
    z-index:3;
    text-align:center;
    margin-top:18px;
    color:var(--pink-deep);
    font-family:'Brush Script MT', cursive;
  }
  .msg h1{
    font-size:40px;
    line-height:1.15;
    margin:0;
    font-weight:400;
    font-family: 'Segoe Script', 'Brush Script MT', cursive;
    text-shadow:0 2px 0 rgba(255,255,255,0.5);
    animation: text-reveal 0.9s ease 0.5s both;
  }
  @keyframes text-reveal{
    0%{ opacity:0; transform:translateY(14px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  .date-badge{
    margin-top:14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    padding:8px 18px;
    border-radius:30px;
    color:var(--pink-deep);
    font-weight:600;
    font-size:14px;
    box-shadow:0 4px 14px rgba(180,20,90,0.18);
    animation: badge-in 0.8s ease 0.8s both;
  }
  @keyframes badge-in{
    0%{ opacity:0; transform:translateY(10px) scale(0.9); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .question{
    margin-top:26px;
    font-size:19px;
    font-style:italic;
    color:var(--pink-deep);
    font-family: Georgia, 'Times New Roman', serif;
    animation: text-reveal 0.9s ease 1s both;
  }

  /* ---------- buttons ---------- */
  .btn-zone{
    position:relative;
    width:100%;
    flex:1;
    z-index:5;
  }

  .yes-btn{
    position:absolute;
    left:50%;
    top:38px;
    transform:translateX(-50%);
    background:linear-gradient(180deg,#ff6fa5,#e8195f);
    color:#fff;
    border:none;
    padding:16px 56px;
    font-size:19px;
    font-weight:700;
    border-radius:40px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(210,20,90,0.45);
    animation: pulse-yes 1.8s ease-in-out infinite, text-reveal 0.9s ease 1.2s both;
    letter-spacing:0.3px;
  }
  @keyframes pulse-yes{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.06); }
  }
  .yes-btn:active{ transform:translateX(-50%) scale(0.94); }

  .no-btn{
    position:absolute;
    background:#fff;
    color:var(--pink-3);
    border:2px solid var(--pink-3);
    padding:16px 56px;
    font-size:19px;
    font-weight:700;
    border-radius:40px;
    cursor:pointer;
    transition:left 0.28s cubic-bezier(.22,1,.36,1),
               top 0.28s cubic-bezier(.22,1,.36,1),
               transform 0.15s ease;
    box-shadow:0 6px 16px rgba(200,20,90,0.18);
    animation:text-reveal 0.9s ease 1.3s both;
    z-index:6;
    user-select:none;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- footer icons ---------- */
  .footer-icons{
    position:absolute;
    bottom:16px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 24px;
    z-index:3;
  }
  .footer-icons div{
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }

  /* ---------- confetti (yes celebration) ---------- */
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:8px;
    height:14px;
    opacity:0.95;
    animation: fall linear forwards;
    z-index:10;
  }
  @keyframes fall{
    to{ transform:translateY(920px) rotate(600deg); opacity:0.3; }
  }

  .celebrate-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255, 190, 220, 0.0);
    pointer-events:none;
    z-index:20;
  }
  .celebrate-text{
    background:#fff;
    color:var(--pink-deep);
    padding:22px 30px;
    border-radius:20px;
    font-size:22px;
    font-weight:700;
    text-align:center;
    box-shadow:0 14px 40px rgba(150,20,80,0.35);
    opacity:0;
    transform:scale(0.7);
    animation: celebrate-in 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes celebrate-in{
    to{ opacity:1; transform:scale(1); }
  }
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- floating ambient decorations -->

  <div class="scene">

    <!-- BEAR -->

      <ellipse cx="80" cy="150" rx="46" ry="10" fill="#00000010"/>

      <path d="M80 101 Q80 108 72 108" stroke="#5a3a24" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- CAKE -->
    <svg class="cake" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
      <rect x="94" y="10" width="10" height="24" rx="3" fill="#7fd8e8"/>

        <ellipse cx="99" cy="4" rx="6" ry="10" fill="#ffb54c"/>

      </g>
      <rect x="55" y="36" width="90" height="42" rx="10" fill="#ffd7e6"/>

      <text x="100" y="66" font-family="Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#c8195f" text-anchor="middle">HAPPY</text>

      <circle cx="35" cy="38" r="20" fill="#2b2b2b"/>
      <circle cx="125" cy="38" r="20" fill="#2b2b2b"/>
      <polygon points="80,-10 55,35 105,35" fill="#7fd8e8"/>
      <circle cx="80" cy="-10" r="6" fill="#fff"/>

  <!-- message -->

  <!-- buttons -->

    <button class="no-btn" id="noBtn">No</button>

  <!-- celebration overlay -->

</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const zone = document.querySelector('.btn-zone');
  const phone = document.getElementById('phone');

  let lastMove = 0;
  const MOVE_COOLDOWN = 300;

  // All escape positions are on the LEFT side of the Yes button.
  // The button keeps the exact same size as the Yes button.
  const escapePositions = [
    { x: 22,  y: 18 },
    { x: 115, y: 82 },
    { x: 22,  y: 150 },
    { x: 135, y: 215 }
  ];

  let escapeIndex = 0;

  function moveNoButton(){
    const now = performance.now();
    if(now - lastMove < MOVE_COOLDOWN) return;
    lastMove = now;

    const zoneRect = zone.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const padding = 10;

    const maxX = Math.max(padding, zoneRect.width - btnW - padding);
    const maxY = Math.max(padding, zoneRect.height - btnH - padding);

    const position = escapePositions[escapeIndex];

    noBtn.style.left = Math.min(position.x, maxX) + 'px';
    noBtn.style.top = Math.min(position.y, maxY) + 'px';

    escapeIndex = (escapeIndex + 1) % escapePositions.length;
  }

  // Run away before the cursor can reach the No button.
  document.addEventListener('mousemove', function(e){
    const r = noBtn.getBoundingClientRect();

    const closestX = Math.max(r.left, Math.min(e.clientX, r.right));
    const closestY = Math.max(r.top, Math.min(e.clientY, r.bottom));

    const distance = Math.hypot(
      e.clientX - closestX,
      e.clientY - closestY
    );

    if(distance < 110){
      moveNoButton();
    }
  });

  // Extra protection.
  noBtn.addEventListener('mouseenter', moveNoButton);

  // Mobile/touch protection.
  noBtn.addEventListener('pointerdown', function(e){
    e.preventDefault();
    e.stopPropagation();
    moveNoButton();
  });

  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    e.stopPropagation();
    moveNoButton();
  }, {passive:false});

  // No can never be selected.
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    moveNoButton();
  });

  function spawnConfetti(){
    const colors = ['#ff8fc0','#ffd166','#7fd8e8','#8fe89b','#c8a4ff','#ff6fa5'];
    for(let i=0;i<60;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random()*100 + '%';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (2 + Math.random()*2) + 's';
      piece.style.animationDelay = (Math.random()*0.5) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      phone.appendChild(piece);
      setTimeout(()=> piece.remove(), 4500);
    }
  }

  yesBtn.addEventListener('click', function(){
    spawnConfetti();
    const overlay = document.getElementById('celebrate');
    overlay.innerHTML = '<div class="celebrate-text">Yay! 🎉<br>Here\'s to an amazing year ahead, Shraddha! 🥳</div>';
    setTimeout(()=>{ overlay.innerHTML = ''; }, 3200);
  });

  // Initial position: LEFT of the centered Yes button.
  window.addEventListener('load', ()=>{
    noBtn.style.left = '22px';
    noBtn.style.top = '18px';
  });
</script>

</body>
</html>
